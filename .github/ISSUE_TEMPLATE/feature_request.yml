name: Feature request
description: An option, a component or an output you need
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need and why?
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API endpoint or parameter involved
      description: Link the section of https://quanticdata.io/docs/ if you know it.
