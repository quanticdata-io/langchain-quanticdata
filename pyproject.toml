[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langchain-quanticdata"
version = "0.1.0"
description = "LangChain integration for QuanticData: web search tool, page-to-Markdown tool, a document loader for pages, crawls and sitemaps, and a live web search retriever."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
requires-python = ">=3.11"
dependencies = ["langchain-core>=1.0,<2", "httpx>=0.27,<1"]
keywords = ["langchain", "web-search", "web-scraping", "document-loader", "retriever", "markdown", "rag", "quanticdata"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/quanticdata-io/langchain-quanticdata"
Documentation = "https://github.com/quanticdata-io/langchain-quanticdata#readme"
Issues = "https://github.com/quanticdata-io/langchain-quanticdata/issues"
Changelog = "https://github.com/quanticdata-io/langchain-quanticdata/blob/main/CHANGELOG.md"
"API reference" = "https://quanticdata.io/docs/"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-socket>=0.7",
  "langchain-tests>=1.0,<2",
  "mypy>=1.13",
  "ruff>=0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_quanticdata"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
"examples/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["langchain_tests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --allow-hosts=127.0.0.1,::1"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
